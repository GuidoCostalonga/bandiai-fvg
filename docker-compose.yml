# ─────────────────────────────────────────────────────────────
# BandiAI FVG — full stack: web + worker + postgres + redis
# Compatible with Coolify / Railway / bare VPS.
#   docker compose up -d
# ─────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bandiai
      POSTGRES_PASSWORD: bandiai
      POSTGRES_DB: bandiai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bandiai']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bandiai:bandiai@postgres:5432/bandiai?schema=public
      REDIS_URL: redis://redis:6379
    env_file: .env
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: .
      target: build # the build stage keeps full source + node_modules + tsx
    restart: unless-stopped
    command: ['pnpm', 'worker']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bandiai:bandiai@postgres:5432/bandiai?schema=public
      REDIS_URL: redis://redis:6379
    env_file: .env

volumes:
  pgdata:
  redisdata:
